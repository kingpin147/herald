<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herald Article UI</title>
    <style>
        :root {
            --primary: #111;
            --background: #fff;
            --text-color: #333;
        }
        body {
            font-family: 'Crimson Text', serif; /* Or whatever premium serif is required */
            background-color: var(--background);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .article-container {
            max-width: 800px;
            width: 100%;
            position: relative;
        }
        .article-title {
            font-family: 'Inter', sans-serif;
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 10px;
            color: var(--primary);
        }
        .article-author {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #666;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .article-body {
            font-size: 1.25rem;
            line-height: 1.8;
            color: #222;
        }
        
        /* The Paywall Blur CSS */
        .paywall-container {
            position: relative;
            overflow: hidden;
            max-height: 250px; 
        }
        .paywall-container::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,0.9) 70%, rgba(255,255,255,1) 100%);
            pointer-events: none;
            backdrop-filter: blur(3px);
        }

        .cta-box {
            text-align: center;
            padding: 40px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            margin-top: -20px; /* Overlap with the blur */
            position: relative;
            z-index: 10;
        }
        .btn-subscribe {
            background-color: var(--primary);
            color: #fff;
            padding: 15px 30px;
            text-decoration: none;
            font-weight: bold;
            font-family: 'Inter', sans-serif;
            display: inline-block;
            margin-top: 20px;
            cursor: pointer;
            border: none;
        }
        #loading {
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            color: #666;
            padding: 50px;
        }
    </style>
</head>
<body>
    <div id="loading">Loading treatise...</div>
    
    <div id="contentWrapper" class="article-container" style="display: none;">
        <h1 id="title" class="article-title"></h1>
        <div id="author" class="article-author"></div>
        
        <!-- Full access container -->
        <div id="fullBody" class="article-body"></div>
        
        <!-- Gated access container -->
        <div id="gatedBody" style="display: none;">
            <div class="article-body paywall-container" id="hookText"></div>
            <div class="cta-box">
                <h3 style="font-family: 'Inter', sans-serif; margin-top:0;">This treatise is for Premium Members.</h3>
                <p style="font-family: 'Inter', sans-serif; color: #555;">Subscribe to unlock the full historical archive and modern treatises.</p>
                <button class="btn-subscribe" onclick="triggerLoginGate()">Read Full Treatise</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // Signal Velo that we are ready to receive the dataset
            window.parent.postMessage({ type: 'COMPONENT_READY' }, "*");
        };

        window.onmessage = function(event) {
            if (event.data && event.data.type === 'RENDER_ARTICLE') {
                const payload = event.data.payload;
                renderArticle(payload.article, payload.hasAccess);
            }
        };

        function renderArticle(article, hasAccess) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('contentWrapper').style.display = 'block';

            document.getElementById('title').innerText = article.title;
            document.getElementById('author').innerText = "By " + article.author;

            if (hasAccess && article.premium_content_html) {
                // Render full body natively inside the HTML component
                document.getElementById('fullBody').innerHTML = article.premium_content_html;
                document.getElementById('fullBody').style.display = 'block';
                document.getElementById('gatedBody').style.display = 'none';
            } else {
                // Render gated body
                document.getElementById('fullBody').style.display = 'none';
                document.getElementById('gatedBody').style.display = 'block';
                document.getElementById('hookText').innerHTML = article.hook_100_words;
            }
        }

        function triggerLoginGate() {
            // Tell Velo to open the Wix Lightbox
            window.parent.postMessage({ type: 'OPEN_LOGIN_GATE' }, "*");
        }
    </script>
</body>
</html>
