<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herald Article List</title>
    <style>
        :root {
            --primary: #111;
            --background: #fdfdfd;
            --border: #e0e0e0;
            --gold: #d4af37;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--primary);
            margin: 0;
            padding: 40px 20px;
        }
        
        /* Filters & Top Bar */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            align-items: center;
            justify-content: space-between;
        }
        .search-input {
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            width: 250px;
        }
        .sort-select {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            background: #fff;
        }
        .tags-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .tag-btn {
            background: #eee;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .tag-btn.active {
            background: var(--primary);
            color: #fff;
        }

        /* Grid Layout */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Card */
        .article-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }
        .premium-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gold);
            color: #fff;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .card-content {
            padding: 20px;
        }
        .card-title {
            font-family: 'Crimson Text', serif;
            font-size: 1.4rem;
            margin: 0 0 10px 0;
            line-height: 1.3;
        }
        .card-meta {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .card-tags {
            font-size: 0.8rem;
            color: #888;
        }

        #loading {
            text-align: center;
            font-size: 1.2rem;
            color: #666;
            margin-top: 50px;
        }
        #noResults {
            text-align: center;
            grid-column: 1 / -1;
            padding: 50px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>

    <div class="controls-bar">
        <div class="tags-container" id="tagsContainer">
            <button class="tag-btn active" onclick="toggleTag('All')">All</button>
            <button class="tag-btn" onclick="toggleTag('Architecture')">Architecture</button>
            <button class="tag-btn" onclick="toggleTag('Design')">Design</button>
            <button class="tag-btn" onclick="toggleTag('Interviews')">Interviews</button>
        </div>
        
        <div style="display: flex; gap: 15px;">
            <input type="text" id="searchInput" class="search-input" placeholder="Search treatises..." oninput="applyFilters()">
            <select id="sortSelect" class="sort-select" onchange="applyFilters()">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="az">Title: A-Z</option>
                <option value="za">Title: Z-A</option>
            </select>
        </div>
    </div>

    <div id="loading">Loading feed...</div>
    <div id="articleGrid" class="article-grid">
        <div id="noResults">No treatises found matching your criteria.</div>
    </div>

    <script>
        let allArticles = [];
        let activeTag = 'All';

        window.onload = function() {
            window.parent.postMessage({ type: 'COMPONENT_READY' }, "*");
        };

        window.onmessage = function(event) {
            if (event.data && event.data.type === 'RENDER_ARTICLE_LIST') {
                document.getElementById('loading').style.display = 'none';
                allArticles = event.data.payload.articles || [];
                
                // Extract dynamic tags from data (optional enhancement)
                // extractTags(allArticles);

                applyFilters();
            }
            if (event.data && event.data.type === 'RENDER_ERROR') {
                document.getElementById('loading').innerText = event.data.payload.message;
            }
        };

        function toggleTag(tag) {
            activeTag = tag;
            
            // Update UI buttons
            const btns = document.querySelectorAll('.tag-btn');
            btns.forEach(btn => {
                if (btn.innerText === tag) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            applyFilters();
        }

        function applyFilters() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const sortOption = document.getElementById('sortSelect').value;

            // Filter
            let filtered = allArticles.filter(article => {
                const matchesSearch = article.title.toLowerCase().includes(searchQuery) || 
                                      (article.author && article.author.toLowerCase().includes(searchQuery));
                
                const matchesTag = activeTag === 'All' || 
                                   (article.tags && article.tags.includes(activeTag));

                return matchesSearch && matchesTag;
            });

            // Sort
            filtered.sort((a, b) => {
                if (sortOption === 'newest') return new Date(b.publishedDate) - new Date(a.publishedDate);
                if (sortOption === 'oldest') return new Date(a.publishedDate) - new Date(b.publishedDate);
                if (sortOption === 'az') return a.title.localeCompare(b.title);
                if (sortOption === 'za') return b.title.localeCompare(a.title);
                return 0;
            });

            renderGrid(filtered);
        }

        function renderGrid(articles) {
            const grid = document.getElementById('articleGrid');
            const noResults = document.getElementById('noResults');
            
            // Clear existing cards (but keep noResults element)
            const cards = grid.querySelectorAll('.article-card');
            cards.forEach(card => card.remove());

            if (articles.length === 0) {
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';

            articles.forEach(article => {
                const dateObj = new Date(article.publishedDate);
                const dateStr = !isNaN(dateObj) ? dateObj.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) : "";
                
                const premiumBadgeHtml = article.premiumPlan ? `<div class="premium-badge">Premium</div>` : '';
                const tagsStr = article.tags ? article.tags.join(', ') : '';

                const cardHtml = `
                    <div class="article-card" onclick="navigateTo('${article.slug}')">
                        ${premiumBadgeHtml}
                        <img class="card-image" src="${article.coverImage || 'https://via.placeholder.com/400x200?text=No+Image'}" alt="${article.title}">
                        <div class="card-content">
                            <div class="card-meta">${dateStr} • By ${article.author || 'CPI'}</div>
                            <h3 class="card-title">${article.title}</h3>
                            <div class="card-tags">${tagsStr}</div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function navigateTo(slug) {
            window.parent.postMessage({
                type: 'NAVIGATE',
                payload: { slug: slug }
            }, "*");
        }
    </script>
</body>
</html>
